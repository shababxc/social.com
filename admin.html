<script>
    // Master Strong Password (You can change this password to whatever you want)
    const MASTER_ADMIN_PASSWORD = "Admin#Secure$9988";

    let failedAttempts = parseInt(localStorage.getItem('admin_failed_attempts') || '0');
    let lockoutUntil = parseInt(localStorage.getItem('admin_lockout_until') || '0');

    function checkLockout() {
      const now = Date.now();
      if (lockoutUntil > now) {
        const remainingMinutes = Math.ceil((lockoutUntil - now) / 60000);
        document.getElementById('lockout-timer').style.display = 'block';
        document.getElementById('lockout-timer').innerText = `Too many failed attempts! Locked for ${remainingMinutes} minute(s).`;
        return true;
      }
      return false;
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('admin-password-input');
      const icon = document.getElementById('toggle-pwd-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function verifyMasterPassword() {
      if (checkLockout()) return;

      const enteredPassword = document.getElementById('admin-password-input').value.trim();

      if (enteredPassword === MASTER_ADMIN_PASSWORD) {
        localStorage.setItem('admin_failed_attempts', '0');
        localStorage.setItem('admin_lockout_until', '0');
        sessionStorage.setItem('admin_authenticated_session', 'true');
        document.getElementById('security-overlay').style.display = 'none';
      } else {
        failedAttempts += 1;
        localStorage.setItem('admin_failed_attempts', failedAttempts.toString());

        if (failedAttempts >= 3) {
          const lockTime = Date.now() + 15 * 60 * 1000; // 15 Minutes Lockout
          localStorage.setItem('admin_lockout_until', lockTime.toString());
          lockoutUntil = lockTime;
          checkLockout();
          alert("Security Alert: 3 failed attempts! Dashboard is locked for 15 minutes.");
        } else {
          alert(`Access Denied! Incorrect Password. (${3 - failedAttempts} attempt(s) remaining)`);
        }
      }
    }

    if (sessionStorage.getItem('admin_authenticated_session') === 'true') {
      document.getElementById('security-overlay').style.display = 'none';
    } else {
      checkLockout();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCizaCuNkTOsdyeLErVsUzjTj6P0Du6zZw",
      authDomain: "social-media-fe850.firebaseapp.com",
      databaseURL: "https://social-media-fe850-default-rtdb.firebaseio.com",
      projectId: "social-media-fe850",
      storageBucket: "social-media-fe850.firebasestorage.app",
      messagingSenderId: "264506398502",
      appId: "1:264506398502:web:56d2722066cb55ec8353e7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let savedBotToken = localStorage.getItem('admin_bot_token') || "";
    if (savedBotToken) {
      document.getElementById('bot-token-input').value = savedBotToken;
    }

    function saveBotToken() {
      const token = document.getElementById('bot-token-input').value.trim();
      if (token) {
        localStorage.setItem('admin_bot_token', token);
        savedBotToken = token;
        alert("Bot Token saved successfully!");
      }
    }

    let currentTab = 'pending';
    let allRequests = {};

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderRequests();
    }

    function loadWithdrawRequests() {
      firebase.database().ref('withdraw_requests').on('value', (snapshot) => {
        allRequests = snapshot.val() || {};
        updateStats();
        renderRequests();
      });
    }

    function updateStats() {
      const list = Object.values(allRequests);
      const pendingCount = list.filter(r => r.status === 'pending').length;
      const approvedCount = list.filter(r => r.status === 'approved').length;
      const totalGram = list.filter(r => r.status === 'approved').reduce((acc, curr) => acc + (parseFloat(curr.gramAmount) || 0), 0);

      document.getElementById('stat-pending').innerText = pendingCount;
      document.getElementById('stat-approved').innerText = approvedCount;
      document.getElementById('stat-total-gram').innerText = totalGram.toFixed(2);
    }

    function renderRequests() {
      const container = document.getElementById('requests-list');
      container.innerHTML = '';

      const list = Object.values(allRequests).filter(r => r.status === currentTab).reverse();

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">No ${currentTab} requests found.</div>`;
        return;
      }

      list.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';

        const reqDate = new Date(req.requestedAt).toLocaleString('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });

        // BUG FIX: యూজারের নামে থাকা সিঙ্গেল কোট (') নিরাপদ করা হলো
        const safeUserName = req.userName ? req.userName.replace(/'/g, "\\'") : 'User';

        let actionsHTML = '';
        if (req.status === 'pending') {
          actionsHTML = `
            <div class="req-actions">
              <button class="action-btn btn-approve" onclick="approveRequest('${req.id}', '${req.userId}', '${safeUserName}', '${req.gramAmount}', '${req.stage}', '${req.walletAddress}')">
                <i class="fas fa-check-circle"></i> Approve & Send Notification
              </button>
              <button class="action-btn btn-reject" onclick="rejectRequest('${req.id}', '${req.userId}', '${req.coins}', '${req.gramAmount}')">
                <i class="fas fa-times-circle"></i> Reject & Refund
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="req-header">
            <div>
              <span class="user-tag">${req.userName}</span>
              <span style="font-size: 11px; color: var(--text-muted); margin-left: 6px;">(ID: ${req.userId})</span>
            </div>
            <span class="status-badge status-${req.status}">${req.status}</span>
          </div>

          <div style="font-size: 13px; color: var(--text-main);">
            <strong>Amount:</strong> <span style="color: var(--accent-blue); font-weight: bold;">${req.gramAmount} $GRAM</span> (${req.coins.toLocaleString()} Coins) | <strong>Stage:</strong> #${req.stage}
          </div>

          <div class="wallet-box">
            <span>💳 ${req.walletAddress}</span>
            <button class="copy-btn" onclick="copyText('${req.walletAddress}')"><i class="fas fa-copy"></i> Copy</button>
          </div>

          <div style="font-size: 11px; color: var(--text-muted);">
            Requested on: ${reqDate}
          </div>

          ${actionsHTML}
        `;

        container.appendChild(card);
      });
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert("Address copied to clipboard: " + text);
    }

    async function approveRequest(reqId, userId, userName, gramAmount, stage, walletAddress) {
      const confirmApprove = confirm(`Have you sent ${gramAmount} $GRAM to:\n${walletAddress}?\n\nClick OK to confirm approval and send Telegram notification.`);
      if (!confirmApprove) return;

      await firebase.database().ref(`withdraw_requests/${reqId}`).update({
        status: "approved",
        approvedAt: Date.now()
      });

      if (savedBotToken) {
        const messageText = `🎉 <b>Congratulations ${userName}!</b>\n\nYour withdrawal request for <b>${gramAmount} $GRAM</b> (Stage #${stage}) has been <b>Approved & Sent</b> to your wallet:\n💳 <code>${walletAddress}</code>\n\nThank you for using our platform! 🚀`;
        
        try {
          const response = await fetch(`https://api.telegram.org/bot${savedBotToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: userId,
              text: messageText,
              parse_mode: "HTML"
            })
          });

          if (response.ok) {
            alert("Withdrawal Approved & Telegram Notification Sent successfully!");
          } else {
            console.error("Telegram API Error:", await response.text());
            alert("Withdrawal Approved, but Telegram API rejected the message.");
          }
        } catch (e) {
          console.error("Fetch Error:", e);
          alert("Withdrawal Approved, but network error prevented sending the message.");
        }
      } else {
        alert("Withdrawal Approved! (Note: Save Telegram Bot Token above to send automated user messages).");
      }
    }

    async function rejectRequest(reqId, userId, coins, gramAmount) {
      const confirmReject = confirm(`Are you sure you want to reject this withdrawal of ${gramAmount} $GRAM?\n${coins} Coins will be refunded to user account.`);
      if (!confirmReject) return;

      await firebase.database().ref(`withdraw_requests/${reqId}`).update({
        status: "rejected",
        rejectedAt: Date.now()
      });

      const userRef = firebase.database().ref(`users/${userId}`);
      const snap = await userRef.once('value');
      const userData = snap.val();
      if (userData) {
        const currentCoins = userData.coins || 0;
        const currentWithdrawals = Math.max(0, (userData.withdrawals || 1) - 1);
        await userRef.update({
          coins: currentCoins + parseInt(coins),
          withdrawals: currentWithdrawals
        });
      }

      if (savedBotToken) {
        const messageText = `❌ <b>Withdrawal Update</b>\n\nYour withdrawal request for <b>${gramAmount} $GRAM</b> has been rejected. <b>${parseInt(coins).toLocaleString()} Coins</b> have been refunded to your account balance.`;
        
        try {
          await fetch(`https://api.telegram.org/bot${savedBotToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: userId,
              text: messageText,
              parse_mode: "HTML"
            })
          });
        } catch (e) {
          console.error("Fetch Error:", e);
        }
      }

      alert("Request Rejected & Coins Refunded to user balance successfully!");
    }

    loadWithdrawRequests();
  </script>
